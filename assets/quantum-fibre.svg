<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
<title id="title">Entanglement distribution over optical fibre</title>
<desc id="desc">Conceptual illustration showing a quantum-photon signal and classical White Rabbit timing signal sharing an optical fibre. Not the exact experimental layout.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122d4b"/><stop offset="1" stop-color="#08111f"/></linearGradient></defs>
<rect width="900" height="380" fill="url(#bg)"/>
<g stroke="#28425d" opacity=".6"><path d="M0 80H900M0 160H900M0 240H900M0 320H900M100 0V380M200 0V380M300 0V380M400 0V380M500 0V380M600 0V380M700 0V380M800 0V380"/></g>
<text x="40" y="42" fill="#a6b5c9" font-size="18" font-family="Arial">CERN QUANTUM NETWORKS · CONCEPTUAL</text>
<rect x="42" y="85" width="816" height="206" rx="24" fill="#0b1929" stroke="#42617e" stroke-width="2"/>
<text x="68" y="120" fill="#eaf5ff" font-family="Arial" font-size="20" font-weight="700">Signals share one optical fibre</text>
<path d="M85 177H815" stroke="#74c4ff" stroke-width="5" stroke-linecap="round"/>
<path d="M85 229H815" stroke="#ffd36e" stroke-width="4" stroke-dasharray="12 10" stroke-linecap="round"/>
<g fill="#74c4ff" stroke="#d8efff" stroke-width="2"><circle cx="180" cy="177" r="10"/><circle cx="340" cy="177" r="10"/><circle cx="500" cy="177" r="10"/><circle cx="660" cy="177" r="10"/></g>
<g fill="#ffd36e"><circle cx="240" cy="229" r="6"/><circle cx="420" cy="229" r="6"/><circle cx="600" cy="229" r="6"/><circle cx="760" cy="229" r="6"/></g>
<text x="86" y="159" fill="#9bd5ff" font-family="Arial" font-size="17">Quantum photon signal</text>
<text x="86" y="258" fill="#ffd36e" font-family="Arial" font-size="17">Classical White Rabbit timing signal</text>
<text x="42" y="329" fill="#a6b5c9" font-family="Arial" font-size="17">Conceptual visual — not a map or exact wiring diagram</text>
</svg>
